buildscript {
  repositories { google(); mavenCentral() }
  dependencies { classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20' }
}
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'com.quralingo.recitation'
  compileSdkVersion rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
  defaultConfig { minSdkVersion 26 }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
}
repositories { google(); mavenCentral() }
dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'ai.quranlab:tajweedformer:4.0.3'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
